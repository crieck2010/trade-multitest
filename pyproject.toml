[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-multitest"
version = "0.1.0"
description = "Multiple-testing correction for trading research: Deflated Sharpe Ratio, White's Reality Check, Hansen's SPA, Holm step-down"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trade-suite" }]
keywords = ["trading", "quant", "statistics", "multiple-testing", "sharpe", "backtest-overfitting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/crieck2010/trade-multitest"
Repository = "https://github.com/crieck2010/trade-multitest"

[project.scripts]
trade-multitest = "trade_multitest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
